user nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    types_hash_bucket_size 64;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    upstream qgis-fcgi {
        # 'qgis-server' is the compose service name: Docker DNS resolves it
        # to all its containers (e.g. `docker compose up --scale qgis-server=3`).
        # nginx only resolves it at startup, so restart nginx after scaling.
        server qgis-server:9993;
    }

    # Get 'host' from `$host` unless 'X-Forwarded-Host'
    # is set by the reverse proxy.
    # 'X-Forwarded-Host' may contain also the port,
    # so it is removed from the variable
    map $http_x_forwarded_host $qgis_host {
        "~(?<h>[^:]+)" $h;
        default $host;
    }
    # Get 'PORT' from `$http_host`
    map $http_host $port {
        "~*.*:(?<p>.*)" $p;
        default $server_port;
    }
    # Get 'HTTPS' status from `$https` unless 'X-Forwarded-Proto'
    # is set by the reverse proxy and contains 'https' scheme
    map $http_x_forwarded_proto $qgis_ssl {
        "https" "on";
        default $https;
    }
    # Get 'PORT' from `$port` unless 'X-Forwarded-Port'
    # is set by the reverse proxy
    map $http_x_forwarded_port $qgis_port {
        "" $port;
        default $http_x_forwarded_port;
    }
    # Get the path prefix from 'X-Forwarded-Prefix' if the
    # reverse proxy serves QGIS Server under a sub-path,
    # trailing slashes are removed
    map $http_x_forwarded_prefix $qgis_prefix {
        "~^(?<prefix>(/[A-Za-z0-9._~-]+)+)/*$" $prefix;
        default "";
    }
    # Get the project file from the project of the '/ogc/' route:
    # <path>/<file>.qgs (or .qgz) -> /io/data/<path>/<file>.qgs
    # <path>/<name> -> /io/data/<path>/<name>/<name>.qgs (<path> is optional)
    map $qgis_project $qgis_project_file {
        "~\.qg[sz]$" /io/data/$qgis_project;
        "~(?<qgis_project_name>[^/]+)$" /io/data/$qgis_project/$qgis_project_name.qgs;
        default "";
    }

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;
        root         /usr/share/nginx/html;

        location / {
            root /var/www/html;
        }
        # Uncomment and adjust the prefix to enable the QGIS Server landing page.
        # Set QGIS_SERVER_LANDING_PAGE_PREFIX and QGIS_SERVER_LANDING_PAGE_PROJECTS_DIRECTORIES
        # environment variables on the qgis-server container accordingly.
        #location /catalog {
        #    fastcgi_pass  qgis-fcgi;
        #    fastcgi_param SCRIPT_FILENAME /usr/lib/cgi-bin/qgis_mapserv.fcgi;
        #    fastcgi_param QUERY_STRING    $query_string;
        #    fastcgi_param HTTPS           $qgis_ssl;
        #    fastcgi_param SERVER_NAME     $qgis_host;
        #    fastcgi_param SERVER_PORT     $qgis_port;
        #    fastcgi_param REQUEST_URI     $qgis_prefix$request_uri;
        #    include fastcgi_params;
        #}
        # /ogc/<project>, optionally followed by the OGC API path (e.g. /ogc/<project>/ogcapi/collections)
        location /ogc/ {
            rewrite ^/ogc/(?<qgis_project>.+?)/?(/(ogcapi|wfs3)(/.*)?)?$ /qgis/qgis_mapserv.fcgi last;
        }
        # OGC API root path: /ogcapi since QGIS 4.2, /wfs3 before
        location /ogcapi/ {
            rewrite ^/ogcapi/(.*)$ /qgis/qgis_mapserv.fcgi;
        }
        location /wfs3/ {
            rewrite ^/wfs3/(.*)$ /qgis/qgis_mapserv.fcgi;
        }
        location /qgis/ {
            internal; # Used only by the OGC rewrite
            root /var/www/data;
            fastcgi_pass  qgis-fcgi;

            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param QUERY_STRING    $query_string;
            # build links in GetCapabilities based on
            # the hostname exposed by the reverse proxy
            fastcgi_param  HTTPS $qgis_ssl;
            fastcgi_param  SERVER_NAME $qgis_host;
            fastcgi_param  SERVER_PORT $qgis_port;
            fastcgi_param  REQUEST_URI $qgis_prefix$request_uri;
            # not passed as MAP, which QGIS Server would add to the OGC API links
            fastcgi_param  QGIS_PROJECT_FILE $qgis_project_file if_not_empty;
            include fastcgi_params;
        }
        error_page 404 /404.html;
            location = /40x.html {
        }
        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }
    }

}
