name: Auto build QGIS Docker images

on:
  schedule:
    # runs once a week
    - cron: '0 6 * * 0'
    # runs every day
    # - cron: '0 6 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # for the default dist, no suffix to tag
  # if modified, also update the Dockerfile!
  DEFAULT_UBUNTU_RELEASE: resolute  
  DOCKER_CLI_EXPERIMENTAL: enabled

jobs:
  test:
    runs-on: ubuntu-latest
    name: unit tests
    steps:
      - uses: actions/checkout@v7

      - name: Install test dependencies
        run: pip3 install pytest

      - name: Run qgis_setup.sh unit tests
        run: bash tests/test_qgis_setup.sh

      - name: Run qgis_startup.py unit tests
        run: pytest tests/test_qgis_startup.py -v

      - name: Run qgis_testrunner.sh unit tests
        run: bash tests/test_qgis_testrunner.sh

      - name: Run server landing page config tests
        run: bash tests/test_server_landing_page.sh

  build-nightly:
    needs: test
    runs-on: ubuntu-latest
    name: build nightly
    strategy:
      fail-fast: false
      matrix:
        qgis_type: [ 'desktop', 'server' ]

    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: define tag
        run: |
          echo "DOCKER_TAG=$( [[ ${{ matrix.qgis_type }} = 'server' ]] && echo 'qgis-server' || echo 'qgis' )" >> $GITHUB_ENV

      - id: nightly
        name: building nightly
        run: docker build -t qgis/${{ env.DOCKER_TAG }}:nightly --build-arg repo=ubuntu-nightly -f ${{ matrix.qgis_type }}/Dockerfile .

      - name: label with QGIS version
        run: |
          IMAGE=qgis/${{ env.DOCKER_TAG }}:nightly
          # the package has the same name as the image (qgis / qgis-server)
          VERSION=$(docker run --rm ${IMAGE} dpkg-query -W -f='${Version}' ${{ env.DOCKER_TAG }})
          # 1:4.3.0+git20261022+149067ad0b9+43questing -> 4.3.0+git20261022+149067ad0b9
          VERSION=${VERSION#*:}
          VERSION=${VERSION%+*}
          printf 'FROM %s\nLABEL org.opencontainers.image.version="%s"\n' ${IMAGE} ${VERSION} | docker build -t ${IMAGE} -
          echo "QGIS ${VERSION} (https://github.com/qgis/QGIS/commit/${VERSION##*+})" >> $GITHUB_STEP_SUMMARY

      - name: test server
        if: ${{ matrix.qgis_type == 'server' }}
        run: |
          docker run -d -v $(pwd)/${{ matrix.qgis_type }}/test/data:/io/data -p 8010:80 --name qgis-server qgis/qgis-server:nightly
          docker exec -i qgis-server dpkg -l qgis-server
          sleep 5
          curl -s 'http://localhost:8010/ogc/test_project?service=WMS&request=GetCapabilities' | grep -ivq exception
          curl -sf 'http://localhost:8010/ogcapi/collections.json?MAP=/io/data/test_project/test_project.qgs' | grep -q '"collections"'
          # links follow the reverse proxy headers, including the path prefix
          PROXY_HEADERS=(-H 'X-Forwarded-Host: example.com' -H 'X-Forwarded-Proto: https' -H 'X-Forwarded-Prefix: /qgis/')
          curl -s "${PROXY_HEADERS[@]}" 'http://localhost:8010/ogc/test_project?service=WMS&request=GetCapabilities' | grep -q '"https://example.com/qgis/ogc/test_project?'
          curl -s "${PROXY_HEADERS[@]}" 'http://localhost:8010/ogcapi/collections.json?MAP=/io/data/test_project/test_project.qgs' | grep -q '"https://example.com:8010/qgis/ogcapi/collections'
          # CORS is disabled by default
          [ -z "$(curl -s -D - -o /dev/null 'http://localhost:8010/ogc/test_project?service=WMS&request=GetCapabilities' | grep -i '^access-control-allow-origin')" ]
          docker rm -f qgis-server

      - name: test server project paths
        if: ${{ matrix.qgis_type == 'server' }}
        run: |
          # mount the parent folder to get a nested project: /io/data/data/test_project/test_project.qgs
          docker run -d -v $(pwd)/${{ matrix.qgis_type }}/test:/io/data -p 8010:80 --name qgis-server-paths qgis/qgis-server:nightly
          sleep 5
          for PROJECT in data/test_project data/test_project/ data/test_project/test_project.qgs; do
            curl -sf "http://localhost:8010/ogc/${PROJECT}?service=WMS&request=GetCapabilities" | grep -q '<WMS_Capabilities'
          done
          docker rm -f qgis-server-paths

      - name: test server landing page
        if: ${{ matrix.qgis_type == 'server' }}
        run: |
          docker run -d -v $(pwd)/${{ matrix.qgis_type }}/test/data:/io/data -p 8010:80 \
            -e QGIS_SERVER_LANDING_PAGE_PREFIX=/catalog \
            -e QGIS_SERVER_LANDING_PAGE_PROJECTS_DIRECTORIES=/io/data \
            --name qgis-server-landing qgis/qgis-server:nightly
          sleep 5
          # Verify the landing page nginx config was generated
          docker exec qgis-server-landing test -f /etc/nginx/qgis.d/landing-page.conf
          # Verify the landing page responds (not a 404)
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8010/catalog/')
          echo "Landing page HTTP status: ${HTTP_CODE}"
          [ "$HTTP_CODE" -ne 404 ]
          docker rm -f qgis-server-landing

      - name: test server as non-root user
        if: ${{ matrix.qgis_type == 'server' }}
        run: |
          docker run -d --user 12345 -v $(pwd)/${{ matrix.qgis_type }}/test/data:/io/data -p 8010:80 \
            -e QGIS_SERVER_LANDING_PAGE_PREFIX=/catalog \
            --name qgis-server-nonroot qgis/qgis-server:nightly
          sleep 5
          curl -s 'http://localhost:8010/ogc/test_project?service=WMS&request=GetCapabilities' | grep -ivq exception
          curl -sf 'http://localhost:8010/ogcapi/collections.json?MAP=/io/data/test_project/test_project.qgs' | grep -q '"collections"'
          docker exec qgis-server-nonroot test -f /etc/nginx/qgis.d/landing-page.conf
          docker rm -f qgis-server-nonroot

      - name: test server CORS
        if: ${{ matrix.qgis_type == 'server' }}
        run: |
          docker run -d -v $(pwd)/${{ matrix.qgis_type }}/test/data:/io/data -p 8010:80 \
            -e NGINX_CORS_ALLOW_ORIGIN=https://example.com \
            --name qgis-server-cors qgis/qgis-server:nightly
          sleep 5
          curl -s -D - -o /dev/null 'http://localhost:8010/ogc/test_project?service=WMS&request=GetCapabilities' | grep -qi '^access-control-allow-origin: https://example.com'
          # Preflight requests are answered by Nginx
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS 'http://localhost:8010/ogc/test_project')" -eq 204 ]
          docker rm -f qgis-server-cors

      - name: test desktop scripts
        if: ${{ matrix.qgis_type == 'desktop' }}
        run: |
          # Verify test runner scripts are installed and executable
          docker run --rm qgis/${{ env.DOCKER_TAG }}:nightly which qgis_setup.sh
          docker run --rm qgis/${{ env.DOCKER_TAG }}:nightly which qgis_testrunner.sh
          docker run --rm qgis/${{ env.DOCKER_TAG }}:nightly test -f /usr/bin/qgis_startup.py
          docker run --rm qgis/${{ env.DOCKER_TAG }}:nightly test -f /usr/bin/qgis_testrunner.py
          # Run qgis_setup.sh and verify it creates config directories
          docker run --rm -e QT_QPA_PLATFORM=offscreen qgis/${{ env.DOCKER_TAG }}:nightly \
            bash -c 'qgis_setup.sh && test -d /root/.local/share/QGIS/QGIS3/profiles/default/QGIS && test -f /root/.local/share/QGIS/QGIS3/startup.py'

      - name: push
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          docker push qgis/${{ env.DOCKER_TAG }}:nightly
          docker tag qgis/${{ env.DOCKER_TAG }}:nightly qgis/${{ env.DOCKER_TAG }}:latest
          docker push qgis/${{ env.DOCKER_TAG }}:latest

  build:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    name: build
    strategy:
      fail-fast: false
      matrix:
        qgis_type: ['desktop', 'server']
        version: ['stable', 'ltr']
        platform:
          - os: ubuntu
            release: noble
          - os: ubuntu
            release: resolute
          - os: debian
            release: trixie
          # - os: debian
          #   release: forky

    steps:
      - uses: actions/checkout@v7

      - id: python_deps
        run: pip3 install packaging

      - id: determine
        name: determine QGIS and Docker versions
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run : |
          DOCKER=$(./scripts/get_docker_image_version.py --qgis=${{ matrix.qgis_type }} --dist=${{ matrix.platform.release }})
          QGIS=$(./scripts/get_ubuntu_qgis_package_version.py --qgis=${{ matrix.qgis_type }} --os=${{ matrix.platform.os }} --dist ${{ matrix.platform.release }})

          DOCKER_VERSION=$(echo "${DOCKER}" | jq ".${{ matrix.version }}")
          QGIS_VERSION=$(echo "${QGIS}" | jq ".${{ matrix.version }}")

          echo "Existing ${{ matrix.version }} docker: ${DOCKER_VERSION}"
          echo "Available ${{ matrix.version }} QGIS: ${QGIS_VERSION}"

          WILL_UPDATE=$(python3 -c "from packaging import version; print(1 if version.parse(${DOCKER_VERSION} or '0') < version.parse(${QGIS_VERSION}) else 0)")

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Force build on workflow dispatch."
            WILL_UPDATE=1
          fi

          if [[ ${WILL_UPDATE} == 1 ]]; then
            echo "--> ${{ matrix.version }} will be updated from ${DOCKER_VERSION} to ${QGIS_VERSION}."
          else
            echo "--> ${{ matrix.version }} is up to date (${QGIS_VERSION})."
          fi

          echo "will_update=${WILL_UPDATE}" >> $GITHUB_OUTPUT
          echo "qgis_version=${QGIS_VERSION//\"/}">> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: ${{ steps.determine.outputs.will_update == 1 }}
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: arm64,arm

      - name: Set up Docker Buildx
        if: ${{ steps.determine.outputs.will_update == 1 }}
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: ${{ steps.determine.outputs.will_update == 1 }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - id: build
        if: ${{ steps.determine.outputs.will_update == 1 }}
        name: build ubuntu image
        env:
          DOCKER_USERNAME: ${{ secrets.docker_username }}
          DOCKER_PASSWORD: ${{ secrets.docker_password }}
        run: ./scripts/build-push-docker.sh ${{ matrix.qgis_type }} ${{ matrix.version }} ${{steps.determine.outputs.qgis_version}} ${{ matrix.platform.os }} ${{ matrix.platform.release }} ${DEFAULT_UBUNTU_RELEASE}
