name: Build QGIS slim Docker images

on:
  schedule:
    # runs once a week
    - cron: '0 6 * * 0'
  pull_request:
    branches:
      - main
    paths:
      - 'slim/**'
      - '.github/workflows/build_qgis_slim.yml'
  push:
    branches:
      - main
      - qgis-slim
    paths:
      - 'slim/**'
      - '.github/workflows/build_qgis_slim.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: qgis/qgis-slim
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  versions:
    runs-on: ubuntu-latest
    name: determine QGIS versions
    outputs:
      qgis: ${{ steps.versions.outputs.qgis }}

    steps:
      - uses: actions/checkout@v7

      - id: versions
        name: determine QGIS versions
        run: |
          # the versions are detected by the scheduled runs, the other runs rebuild the published images:
          # the nightly, stable and ltr ones, with all the tags sharing their digest
          if [[ ${GITHUB_EVENT_NAME} != schedule ]]; then
            QGIS=$(curl -fsSL "https://hub.docker.com/v2/repositories/${IMAGE}/tags?page_size=100" \
              | jq -c '[.results | group_by(.digest)[] | map(.name) | select(any(.[]; IN("nightly", "stable", "ltr")))
                  | {name: map(select(. == "nightly" or test("^[0-9]+\\.[0-9]+$")))[0], tags: join(" ")}]')
            for NAME in $(echo "${QGIS}" | jq -r '.[].name'); do
              LABELS=$(docker buildx imagetools inspect ${IMAGE}:${NAME} --format '{{ json .Image }}' | jq -c 'first(.[]).config.Labels')
              QGIS=$(echo "${QGIS}" | jq -c --arg name ${NAME} --argjson labels "${LABELS}" \
                'map(if .name == $name then . + {ref: $labels["org.opencontainers.image.revision"], version: $labels["org.opencontainers.image.version"]} else . end)')
            done
          fi

          # also when nothing is published yet
          if [[ ${QGIS:-[]} == "[]" ]]; then
            # nightly is built from the current master commit
            SHA=$(git ls-remote https://github.com/qgis/QGIS.git refs/heads/master | cut -f1)
            CMAKELISTS=$(curl -fsSL https://raw.githubusercontent.com/qgis/QGIS/${SHA}/CMakeLists.txt)
            VERSION=$(for PART in MAJOR MINOR PATCH; do
              echo "${CMAKELISTS}" | sed -nE "s/^set\(CPACK_PACKAGE_VERSION_${PART} \"([0-9]+)\"\)/\1/p"
            done | paste -sd. -)
            QGIS=$(jq -cn --arg ref ${SHA} --arg version ${VERSION} \
              '[{name: "nightly", ref: $ref, version: $version, tags: "nightly latest"}]')

            # the stable and long term releases are built from the last tag of their minor version, since QGIS 4.2:
            # the stable release is the last minor version, the long term release is the one packaged as such
            RELEASES=$(git ls-remote --tags --refs https://github.com/qgis/QGIS.git 'final-*' \
              | sed -nE 's|.*refs/tags/final-([0-9]+_[0-9]+_[0-9]+)$|\1|p' \
              | jq -Rn '[inputs | split("_") | map(tonumber) | select(. >= [4, 2])] | group_by(.[0:2]) | map(max | map(tostring) | join("."))')
            LTR=$(./scripts/get_ubuntu_qgis_package_version.py --qgis=desktop --os=ubuntu --dist=resolute | jq -r .ltr)
            QGIS=$(jq -cn --argjson qgis "${QGIS}" --argjson releases "${RELEASES}" --arg ltr ${LTR} '
              def minor: split(".")[0:2] | join(".");
              $qgis + [$releases[] as $version
                | select($version == $releases[-1] or ($version | minor) == ($ltr | minor)) | {
                name: ($version | minor),
                ref: "final-\($version | split(".") | join("_"))",
                version: $version,
                tags: ([($version | minor), $version]
                  + (if $version == $releases[-1] then ["stable"] else [] end)
                  + (if ($version | minor) == ($ltr | minor) then ["ltr"] else [] end)
                  | join(" "))
              }]')
          fi

          echo "qgis=${QGIS}" >> $GITHUB_OUTPUT
          echo "${QGIS}" | jq -r '.[] | "- \(.name): QGIS \(.version) (\(.ref)), tags: \(.tags)"' >> $GITHUB_STEP_SUMMARY

  build:
    needs: versions
    name: build ${{ matrix.qgis.name }} ${{ matrix.arch }}
    # compiling QGIS under emulation would be too slow, each architecture is built on its own runner
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        qgis: ${{ fromJSON(needs.versions.outputs.qgis) }}
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v7

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - id: buildx
        uses: docker/setup-buildx-action@v4

      - id: ccache
        name: restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: qgis-slim-ccache-${{ matrix.arch }}-${{ matrix.qgis.name }}-${{ github.run_id }}
          restore-keys: |
            qgis-slim-ccache-${{ matrix.arch }}-${{ matrix.qgis.name }}-
            qgis-slim-ccache-${{ matrix.arch }}-

      - name: inject ccache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {"ccache": {"target": "/root/.ccache", "id": "ccache"}}
          skip-extraction: ${{ steps.ccache.outputs.cache-hit }}

      # the build stages are cached one by one, so that they are not rebuilt if a later one fails,
      # each in its own scope, as a cache export replaces the previous one of its scope
      - name: build GDAL
        uses: docker/build-push-action@v7
        with:
          context: .
          file: slim/Dockerfile
          target: gdal
          cache-from: type=gha,scope=qgis-slim-gdal-${{ matrix.arch }}
          cache-to: type=gha,scope=qgis-slim-gdal-${{ matrix.arch }},mode=max

      - name: build QGIS
        uses: docker/build-push-action@v7
        with:
          context: .
          file: slim/Dockerfile
          target: builder
          build-args: qgis_ref=${{ matrix.qgis.ref }}
          cache-from: |
            type=gha,scope=qgis-slim-gdal-${{ matrix.arch }}
            type=gha,scope=qgis-slim-${{ matrix.qgis.name }}-builder-${{ matrix.arch }}
          cache-to: type=gha,scope=qgis-slim-${{ matrix.qgis.name }}-builder-${{ matrix.arch }},mode=max

      - name: build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: slim/Dockerfile
          build-args: qgis_ref=${{ matrix.qgis.ref }}
          labels: |
            org.opencontainers.image.version=${{ matrix.qgis.version }}
            org.opencontainers.image.revision=${{ matrix.qgis.ref }}
          load: true
          tags: ${{ env.IMAGE }}:${{ matrix.qgis.name }}
          cache-from: |
            type=gha,scope=qgis-slim-gdal-${{ matrix.arch }}
            type=gha,scope=qgis-slim-${{ matrix.qgis.name }}-builder-${{ matrix.arch }}
            type=gha,scope=qgis-slim-${{ matrix.qgis.name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=qgis-slim-${{ matrix.qgis.name }}-${{ matrix.arch }},mode=max

      - name: image size
        run: |
          docker image ls ${IMAGE}:${{ matrix.qgis.name }}
          SIZE=$(docker image inspect -f '{{ .Size }}' ${IMAGE}:${{ matrix.qgis.name }})
          echo "${{ matrix.qgis.name }} ${{ matrix.arch }} image size: $(( SIZE / 1024 / 1024 )) MB" >> $GITHUB_STEP_SUMMARY
          # the largest packages and QGIS directories, in KB
          docker run --rm ${IMAGE}:${{ matrix.qgis.name }} bash -c '
            dpkg-query -Wf "\${Installed-Size}\t\${Package}\n" | sort -n | tail -30
            du -s /usr/share/qgis/resources/* /usr/share/qgis/python/qgis/* | sort -n | tail -15
          '

      - name: test PyQGIS
        run: docker run --rm -v $(pwd)/slim/test:/test ${IMAGE}:${{ matrix.qgis.name }} python3 /test/test_slim.py

      - name: test pip
        run: docker run --rm ${IMAGE}:${{ matrix.qgis.name }} bash -c 'pip install --no-deps --quiet humanize && python3 -c "import humanize"'

      - name: test xvfb
        run: |
          docker run --rm ${IMAGE}:${{ matrix.qgis.name }} xvfb-run -a env QT_QPA_PLATFORM=xcb python3 -c '
          from qgis.core import QgsApplication
          app = QgsApplication([], True)
          assert app.platformName() == "xcb", app.platformName()
          '

      - name: test qgis_process
        run: |
          docker run --rm -v $(pwd)/server/test/data:/data ${IMAGE}:${{ matrix.qgis.name }} bash -c '
            set -e
            qgis_process --version
            qgis_process run native:buffer --INPUT=/data/test_project/layers/layer.gpkg --DISTANCE=1 --OUTPUT=/tmp/buffer.parquet
            ogrinfo -so -al /tmp/buffer.parquet | grep -q "Feature Count: [1-9]"
            # the Python plugins are loaded and their algorithms listed
            qgis_process list > /tmp/list 2>&1
            if grep -E "Traceback|error (loading|starting) plugin" /tmp/list; then exit 1; fi
            grep -q "gdal:buffervectors" /tmp/list
          '

      - name: Login to Docker Hub
        if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - id: push
        name: push by digest
        if: ${{ env.PUSH == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: slim/Dockerfile
          build-args: qgis_ref=${{ matrix.qgis.ref }}
          labels: |
            org.opencontainers.image.version=${{ matrix.qgis.version }}
            org.opencontainers.image.revision=${{ matrix.qgis.ref }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=qgis-slim-gdal-${{ matrix.arch }}
            type=gha,scope=qgis-slim-${{ matrix.qgis.name }}-builder-${{ matrix.arch }}
            type=gha,scope=qgis-slim-${{ matrix.qgis.name }}-${{ matrix.arch }}

      - name: export digest
        if: ${{ env.PUSH == 'true' }}
        run: |
          mkdir -p ${{ runner.temp }}/digests
          DIGEST="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        if: ${{ env.PUSH == 'true' }}
        with:
          name: digest-${{ matrix.qgis.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  push:
    needs: [versions, build]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    name: push ${{ matrix.qgis.name }} multi-arch image
    strategy:
      fail-fast: false
      matrix:
        qgis: ${{ fromJSON(needs.versions.outputs.qgis) }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.qgis.name }}-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/setup-buildx-action@v4

      - name: create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          TAGS=$(printf -- "--tag ${IMAGE}:%s " ${{ matrix.qgis.tags }})
          docker buildx imagetools create ${TAGS} $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect ${IMAGE}:${{ matrix.qgis.name }}
